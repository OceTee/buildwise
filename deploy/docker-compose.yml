# Single-host deployment: Postgres, API, background worker and website.
# Run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
# Put a TLS-terminating reverse proxy in front of the web service (port 3000).
name: buildwise

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://buildwise:${POSTGRES_PASSWORD}@db:5432/buildwise
  AUTH_SECRET: ${AUTH_SECRET}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
  CHECKOUT_WEBHOOK_SECRET: ${CHECKOUT_WEBHOOK_SECRET}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
  MARKET_PACK: ${MARKET_PACK:-demo-2026.1}
  EXPOSE_OTP: "false"
  STORAGE_DIR: /data/objects
  OUTBOX_DIR: /data/outbox
  RATE_LIMIT_STORE: postgres
  SMS_PROVIDER: ${SMS_PROVIDER}
  TERMII_API_KEY: ${TERMII_API_KEY:-}
  TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  BUILDER_AI_PROVIDER: ${BUILDER_AI_PROVIDER:-none}
  ARCHITECT_PROVIDER: ${ARCHITECT_PROVIDER:-none}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  RENDER_PROVIDER: ${RENDER_PROVIDER:-none}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  RENDER_MODEL: ${RENDER_MODEL:-}
  DESIGNER_PROVIDER: ${DESIGNER_PROVIDER:-none}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DESIGNER_MODEL: ${DESIGNER_MODEL:-}
  DREAM_PROVIDER: ${DREAM_PROVIDER:-none}
  DREAM_MODEL: ${DREAM_MODEL:-}
  DREAM_PER_MINUTE: ${DREAM_PER_MINUTE:-4}
  DREAM_DAILY_LIMIT: ${DREAM_DAILY_LIMIT:-200}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: buildwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: buildwise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildwise"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      <<: *api-env
      RUN_WORKER_IN_PROCESS: "false"
    volumes: [objects:/data]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: ["pnpm", "--filter", "@bw/api", "worker"]
    environment: *api-env
    volumes: [objects:/data]
    depends_on: { api: { condition: service_started } }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      API_URL: http://api:4000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  objects:
